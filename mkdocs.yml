site_name: astrodynamics-mcp
site_description: Model Context Protocol server giving LLM clients authoritative astrodynamics tools.
site_url: https://astro-tools.github.io/astrodynamics-mcp/
repo_url: https://github.com/astro-tools/astrodynamics-mcp
repo_name: astro-tools/astrodynamics-mcp
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: false
            show_symbol_type_heading: true
            members_order: source
            docstring_style: google
            separate_signature: true
            show_signature_annotations: true
            heading_level: 3
            filters: ["!^_"]

hooks:
  - docs/_hooks.py

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Pick a client: pick-a-client.md
  - Tool reference: tool-reference.md
  - API reference: api.md
  - Recipes: recipes.md
  - Data sources: data-sources.md
  - Credentials: credentials.md
  - GMAT integration: gmat-integration.md
  - Eval suite: eval-suite.md
  - Supported clients: supported-clients.md
  - FAQ: faq.md
  - Output shaping: output-shaping.md
  - Privacy: privacy.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
