name: Eval

on:
  pull_request:
  workflow_dispatch:
    inputs:
      tier:
        description: "Optional tier filter (single_tool | sequential | planning). Empty runs the full suite."
        required: false
        default: ""
        type: choice
        options: ['', 'single_tool', 'sequential', 'planning']

concurrency:
  group: eval-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  eval:
    name: eval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # `models: read` lets the workflow call api.github.com/inference
      # via the auto-generated GITHUB_TOKEN. `pull-requests: write` is
      # only used by the comment step.
      models: read
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --all-groups

      - name: Probe GitHub Models auth
        # Run a one-token call against gpt-4o before the full suite so any
        # auth failure surfaces here as a clear HTTP status and error body,
        # rather than buried inside the Inspect AI stack trace. Prefer the
        # MODELS_PAT secret when present (workflow-issued GITHUB_TOKEN can
        # 403 even with `permissions: models: read` if the org hasn't
        # enabled GitHub Models for Actions); fall back to the workflow
        # token otherwise.
        env:
          MODELS_PAT: ${{ secrets.MODELS_PAT }}
          WORKFLOW_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOKEN="${MODELS_PAT:-$WORKFLOW_TOKEN}"
          status=$(curl -s -o /tmp/probe.json -w '%{http_code}' \
            https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"model":"openai/gpt-4o","messages":[{"role":"user","content":"PING"}],"max_tokens":2}')
          echo "HTTP $status"
          cat /tmp/probe.json
          test "$status" = "200"

      - name: Run eval suite
        env:
          # The openai-api/github/* provider in Inspect AI derives env vars
          # from the segment after the slash; here `github` maps to GITHUB_*.
          # MODELS_PAT (if set) overrides the workflow-issued GITHUB_TOKEN —
          # see the probe step above for the rationale.
          GITHUB_API_KEY: ${{ secrets.MODELS_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_BASE_URL: https://models.github.ai/inference
        run: |
          # -M strict_tools=false: our tool schemas use pydantic unions
          # (anyOf + $ref), which OpenAI's strict-mode tool-calling
          # validation rejects. Non-strict mode still validates argument
          # presence and type; only the schema-traversal rules differ.
          if [ -n "${{ inputs.tier }}" ]; then
            uv run inspect eval eval/tasks.py@astrodynamics_mcp_eval_subset \
              -T tier="${{ inputs.tier }}" \
              --model openai-api/github/openai/gpt-4o \
              -M strict_tools=false \
              --temperature 0 \
              --log-dir logs
          else
            uv run inspect eval eval/tasks.py@astrodynamics_mcp_eval \
              --model openai-api/github/openai/gpt-4o \
              -M strict_tools=false \
              --temperature 0 \
              --log-dir logs
          fi

      - name: Upload Inspect log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspect-eval-logs
          path: logs/
          retention-days: 14

      - name: Generate PR-comment report
        id: report
        if: always()
        # `set +e` so we capture both stdout and the exit code; the
        # workflow fails on the exit code in the dedicated step below
        # so the comment is posted even when the gate fails.
        run: |
          set +e
          uv run python eval/_ci_report.py \
            --log-dir logs \
            --threshold 0.80 > /tmp/eval_report.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/eval_report.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Enforce threshold
        # The report step uses `set +e`, so we fail here based on its exit code.
        # Code 0 = passed gate, 1 = below threshold, 2 = missing or empty log.
        if: steps.report.outputs.exit_code != '0'
        run: |
          echo "Eval gate failed: _ci_report.py exited with ${{ steps.report.outputs.exit_code }}."
          exit 1
