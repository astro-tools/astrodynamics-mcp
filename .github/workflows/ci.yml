name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # 3 OS × 3 Python minors = 9 cells.
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project
        run: uv sync --all-groups

      - name: Run pytest
        # `-m "integration or not integration"` overrides the default
        # marker filter in pyproject.toml so CI runs both unit and
        # integration suites in a single invocation.
        run: uv run pytest -m "integration or not integration" --cov --cov-report=term-missing

      - name: Enforce coverage gates
        # Per CONTRIBUTING.md: 90% overall, 95% on the layers whose
        # correctness the LLM consumer can't sanity-check (units,
        # schemas, data adapters). Run only on Ubuntu / Python 3.12 to
        # avoid platform-specific differences inflating misses.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          uv run coverage report --fail-under=90
          uv run coverage report --include='src/astrodynamics_mcp/units.py' --fail-under=95
          uv run coverage report --include='src/astrodynamics_mcp/schemas/*' --fail-under=95
          uv run coverage report --include='src/astrodynamics_mcp/data/*' --fail-under=95

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-groups
      - run: uv run ruff check
      - run: uv run ruff format --check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-groups
      - run: uv run mypy

  # Smoke-check that `pip install astrodynamics-mcp` (no extras, no dev group)
  # imports cleanly and the console script resolves. Catches an extras-only
  # dependency leaking into the default install path. The full test job above
  # exercises every dev dep via the dev group; this is a small canary.
  minimal-install:
    name: minimal install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install .
      - run: python -c "import astrodynamics_mcp"
      - run: astrodynamics-mcp --version

  # Parallel smoke-check that `pip install astrodynamics-mcp[gmat]` resolves
  # and the four GMAT placeholder tool slots register on import. We do not
  # install a real GMAT binary here — `gmat-run` imports without one and the
  # placeholder bodies never execute. Per-tool issues will add a real
  # `setup-gmat` matrix when they need to run end-to-end.
  gmat-extra-install:
    name: "[gmat] extra install smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install '.[gmat]'
      - name: GMAT tool slots register
        run: |
          python - <<'PY'
          import asyncio

          from astrodynamics_mcp.server import mcp

          tools = {t.name for t in asyncio.run(mcp.list_tools())}
          expected = {
              "gmat_run_mission",
              "gmat_sweep",
              "gmat_execute_script",
              "gmat_validate_script",
          }
          missing = expected - tools
          assert not missing, f"missing GMAT tool slots after [gmat] install: {missing}"
          PY

  # Parallel smoke-check that `pip install astrodynamics-mcp[spice]` resolves
  # (pulls spiceypy) and the seven SPICE placeholder tool slots register on
  # import. The bodies are NotImplementedError placeholders and never execute
  # here; per-tool issues add real kernels + bodies. The base install path is
  # covered by `minimal-install` above, which confirms SPICE stays absent
  # without the extra.
  spice-extra-install:
    name: "[spice] extra install smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install '.[spice]'
      - name: SPICE tool slots register
        run: |
          python - <<'PY'
          import asyncio

          from astrodynamics_mcp.server import mcp

          tools = {t.name for t in asyncio.run(mcp.list_tools())}
          expected = {
              "spice_load_kernel",
              "spice_list_kernels",
              "spice_unload_kernel",
              "spice_state",
              "spice_frame_transform",
              "spice_body_parameters",
              "spice_time_convert",
          }
          missing = expected - tools
          assert not missing, f"missing SPICE tool slots after [spice] install: {missing}"
          PY

  # Parallel smoke-check that `pip install astrodynamics-mcp[viz]` resolves
  # (pulls matplotlib + gmat-czml) and the four viz tool slots register on
  # import. matplotlib and gmat-czml aren't in the standard test env, so this is
  # where the PNG-determinism guarantee and the gmat-czml-backed tool bodies are
  # exercised: the static-plot and czml_trajectory tests run here, and the same
  # figure must render to byte-identical bytes (what the transport-equivalence
  # contract relies on). The base install path stays viz-free — `minimal-install`
  # above confirms the viz slots are absent without the extra.
  viz-extra-install:
    name: "[viz] extra install smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install '.[viz]'
      - name: viz tool slots register
        run: |
          python - <<'PY'
          import asyncio

          from astrodynamics_mcp.server import mcp

          tools = {t.name for t in asyncio.run(mcp.list_tools())}
          expected = {
              "plot_ground_track",
              "plot_trajectory",
              "plot_porkchop",
              "czml_trajectory",
          }
          missing = expected - tools
          assert not missing, f"missing viz tool slots after [viz] install: {missing}"
          PY
      - name: PNG rendering is deterministic
        run: |
          python - <<'PY'
          from matplotlib.figure import Figure

          from astrodynamics_mcp.viz_render import render_png, use_agg_backend


          def build():
              fig = Figure(figsize=(4.0, 3.0))
              ax = fig.add_subplot(111)
              ax.plot([0.0, 1.0, 2.0, 3.0], [3.0, 1.0, 2.0, 0.0])
              ax.set_title("determinism")
              return fig


          use_agg_backend()
          assert render_png(build()).startswith(b"\x89PNG\r\n\x1a\n"), "not a PNG"
          assert render_png(build()) == render_png(build()), "non-deterministic PNG render"
          PY
      # With matplotlib present (only here), run the static-plot tool tests so
      # the PNG-bearing tool bodies are actually exercised — the standard test
      # job above skips them (matplotlib is not in the dev environment). The
      # pure-helper layer of these files runs there; this is the rendering half.
      - name: viz static-plot tool tests
        run: |
          pip install pytest pytest-asyncio
          pytest tests/test_tool_viz_plots.py tests/test_viz_render.py tests/test_tool_czml_trajectory.py tests/test_viz_coverage_gaps.py
      # Run the [viz]-gated example sessions (05 / 06) end-to-end — they need
      # matplotlib + gmat-czml to register the plot / czml tools, so they only
      # run here. They are integration-marked (subprocess smoke tests), so
      # enable that marker explicitly.
      - name: viz example sessions run end-to-end
        run: pytest tests/test_examples_viz.py -m "integration or not integration"
