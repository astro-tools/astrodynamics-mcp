prompt: |
  I'm planning a Mars mission departing in late 2026. What's the best
  launch window? Find the cheapest (departure, arrival) pair assuming a
  depart window of 2026-10-01 through 2026-12-01 and an arrival window
  of 2027-06-01 through 2027-11-01.
tier: single_tool
tools_required: [porkchop]
permitted_traces:
  - - tool: porkchop
      arg_constraints:
        departure_body: {case_insensitive_equals: "earth"}
        arrival_body: {case_insensitive_equals: "mars"}
functional_answer:
  - path: "$.best.c3.value"
    in_range: [8, 30]
  - path: "$.best.c3.unit"
    equals: "km^2/s^2"
  - path: "$.best.total_dv.unit"
    equals: "km/s"
  - path: "$.grid"
    length: {min: 100}
notes: |
  Primary single-tool path. The 2026 Earth-Mars window is well-known
  in the C3 ~10-25 km²/s² band; we bracket loosely [8, 30] to tolerate
  small differences in the ephemeris source.
