prompt: |
  Same Mars approach as before — position (5000, 0, 0) km, velocity
  (0, 5.069, 0) km/s in Mars-centred ICRF, valid at 2026-11-30T00:00:00Z,
  closest-approach epoch 2026-12-01T00:00:00Z. I want to bias B·R to
  200 km. What impulsive Δv at the current state achieves that?
tier: single_tool
tools_required: [bplane_target]
permitted_traces:
  - - tool: bplane_target
      arg_constraints:
        target_body: {case_insensitive_equals: "mars"}
        target_btr_km: {numeric_tolerance: {expected: 200.0, abs: 0.001}}
functional_answer:
  - path: "$.dv_required"
    present: true
  - path: "$.dv_required.unit"
    equals: "km/s"
  - path: "$.residual.magnitude.unit"
    equals: "km"
notes: |
  Off-axis variant — targeting mode (target_btr_km supplied). Drives the
  dv_required and residual populated branches of the response.
