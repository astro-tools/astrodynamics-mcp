prompt: |
  Furnish the leap-second kernel
    https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
  and the planetary ephemeris
    https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp
  with SPICE. First convert 2026-01-01T00:00:00Z (UTC) to ephemeris time so I
  can see the ET seconds, then query the Moon's state relative to Earth at that
  same epoch in the J2000 frame.
tier: sequential
tools_required: [spice_load_kernel, spice_time_convert, spice_state]
requires_spice: true
permitted_traces:
  - - tool: spice_load_kernel
    - tool: spice_time_convert
      arg_constraints:
        from_scale: {equals: "UTC"}
        to_scale: {equals: "ET"}
    - tool: spice_state
      arg_constraints:
        target: {case_insensitive_equals: "MOON"}
        observer: {case_insensitive_equals: "EARTH"}
functional_answer:
  - path: "$.frame"
    equals: "J2000"
  - path: "$.states[0].velocity.unit"
    equals: "km/s"
  - path: "$.states[0].position.value"
    l2_in_range: [356500, 406700]
notes: |
  Sequential: kernel-backed time conversion feeding a state query. Gives
  spice_time_convert a sequential-tier appearance alongside spice_state. The
  chain ends on spice_state, so the functional checks are the J2000 frame echo
  and the geocentric lunar distance bracket (perigee ~356500, apogee ~406700
  km). requires_spice — skipped without the extra or the cached kernels.
