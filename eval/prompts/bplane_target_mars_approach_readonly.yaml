prompt: |
  I have a spacecraft on approach to Mars at the following state:
  position (5000, 0, 0) km, velocity (0, 5.069, 0) km/s in Mars-centred
  ICRF, valid at 2026-11-30T00:00:00Z. The closest-approach epoch is
  2026-12-01T00:00:00Z. What are the B-plane coordinates and the
  v-infinity?
tier: single_tool
tools_required: [bplane_target]
permitted_traces:
  - - tool: bplane_target
      arg_constraints:
        target_body: {case_insensitive_equals: "mars"}
        target_epoch: {equals: "2026-12-01T00:00:00Z"}
functional_answer:
  - path: "$.b_r.unit"
    equals: "km"
  - path: "$.b_t.unit"
    equals: "km"
  - path: "$.v_infinity.unit"
    equals: "km/s"
  - path: "$.dv_required"
    present: false
  - path: "$.residual"
    present: false
notes: |
  Primary single-tool path — read-only B-plane query (no targeting).
  The LLM omits target_btr_km / target_btt_km; the response carries
  the B-plane coordinates and v-infinity but no dv_required / residual.
