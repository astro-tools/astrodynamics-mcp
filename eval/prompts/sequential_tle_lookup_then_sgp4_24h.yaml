prompt: |
  Fetch the current TLE for the ISS (NORAD 25544) and propagate it 24
  hours forward from 2024-01-01T00:00:00Z, sampling every 10 minutes.
tier: sequential
tools_required: [tle_lookup, sgp4_propagate]
permitted_traces:
  - - tool: tle_lookup
      arg_constraints:
        query: {equals: "25544"}
    - tool: sgp4_propagate
      arg_constraints:
        epochs: {length: 145}
        frame: {one_of: ["TEME", null]}
functional_answer:
  - path: "$.states"
    length: 145
  - path: "$.states[*].r.unit"
    all_equal: "km"
  - path: "$.states[*].v.unit"
    all_equal: "km/s"
notes: |
  Canonical two-tool chain: TLE lookup feeds the SGP4 propagator with a
  144-step (every 10 min over 24 h) epoch grid plus an endpoint = 145.
