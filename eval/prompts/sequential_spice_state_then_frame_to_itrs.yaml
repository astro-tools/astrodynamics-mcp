prompt: |
  Using SPICE, get the Moon's position and velocity relative to Earth at
  2026-01-01T00:00:00Z in the J2000 frame, then express that state in the
  Earth-fixed ITRS frame. Furnish the leap-second kernel
    https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
  and the planetary ephemeris
    https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp
  for the SPICE state query. J2000 is aligned with ICRF, so use the regular
  frame_transform tool for the ITRS rotation.
tier: sequential
tools_required: [spice_load_kernel, spice_state, frame_transform]
requires_spice: true
permitted_traces:
  - - tool: spice_load_kernel
    - tool: spice_state
      arg_constraints:
        target: {case_insensitive_equals: "MOON"}
        observer: {case_insensitive_equals: "EARTH"}
    - tool: frame_transform
      arg_constraints:
        to_frame: {equals: "ITRS"}
functional_answer:
  - path: "$.state.frame"
    equals: "ITRS"
  - path: "$.state.r.unit"
    equals: "km"
notes: |
  Cross-path: SPICE SPK state -> astropy kernel-free frame_transform. The
  model bridges CSPICE's J2000 (Earth mean equator/equinox of J2000, aligned
  with ICRF) to astropy's ICRF when handing the state to frame_transform, so
  the frame_transform input frame is left unconstrained; the final response is
  frame_transform's, hence the ITRS functional checks. ITRS needs IERS
  Bulletin A — the same Earth-orientation path the SGP4->ITRS prompt
  exercises. requires_spice — skipped without the extra or the cached kernels.
