prompt: |
  Take the same ISS TLE
    line1='1 25544U 98067A   24001.50000000  .00010000  00000-0  18000-3 0  9990'
    line2='2 25544  51.6400  90.0000 0001000  90.0000 270.0000 15.50000000000000'
  and give me the state at 2024-06-15T08:00:00Z in the GCRS frame.
tier: single_tool
tools_required: [sgp4_propagate]
permitted_traces:
  - - tool: sgp4_propagate
      arg_constraints:
        epochs: {equals: ["2024-06-15T08:00:00Z"]}
        frame: {equals: "GCRS"}
functional_answer:
  - path: "$.states"
    length: 1
  - path: "$.states[0].frame"
    equals: "GCRS"
  - path: "$.states[0].r.value"
    l2_in_range: [6500, 7500]
notes: |
  Off-axis variant — explicit non-default frame ('GCRS'). Exercises the
  astropy frame-transform path distinct from the TEME-native primary.
