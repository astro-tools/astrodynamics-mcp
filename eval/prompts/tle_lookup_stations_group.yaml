prompt: "List the currently tracked space stations and their TLEs."
tier: single_tool
tools_required: [tle_lookup]
permitted_traces:
  - - tool: tle_lookup
      arg_constraints:
        query: {case_insensitive_equals: "stations"}
functional_answer:
  - path: "$.results"
    length: {min: 2}
  - path: "$.results[*].tle_line1"
    present: true
  - path: "$.results[*].tle_line2"
    present: true
notes: |
  Off-axis variant — CelesTrak GROUP code path (multi-satellite response),
  distinct from the per-satellite NORAD/name lookups. Asserts the response
  is multi-result with TLE lines populated on every entry. Uses the
  'stations' group (~27 satellites, ~12 KB raw OMM) because the larger
  'active'/'weather'/'starlink' groups blow past the GitHub Models Free-
  tier 8000-token input cap once each record is wrapped in TleResult.
