tier: single_tool
tools_required: [plot_porkchop]
requires_viz: true
permitted_traces:
  - - tool: plot_porkchop
      arg_constraints:
        porkchop_result: {has_fields: ["best", "grid"]}
expected_attachment: image
notes: |
  Single-tool path for plot_porkchop. Unlike the other plot tools its input is
  itself a tool's output, so a minimal full grid (2 depart x 2 arrive = 4
  feasible cells — the smallest a filled contour can render) is supplied inline
  and passed through verbatim; has_fields asserts the call carried the grid
  rather than a summary-only result. The golden is trace + attachment (a PNG
  ImageContent); no functional_answer (the summary is ASCII text, not JSON).
