prompt: |
  Give me the physical metadata — mass, dimensions, and launch date — for
  the satellite with NORAD ID 25544.
tier: single_tool
tools_required: [satellite_metadata]
permitted_traces:
  - - tool: satellite_metadata
      arg_constraints:
        norad_id: {equals: "25544"}
      expect_error: "credential_required.discosweb"
functional_answer: []
notes: |
  Credentialed error-path: satellite_metadata requires a DISCOSweb token and
  raises credential_required.discosweb before any network call when it is
  absent. No requires_credential — the prompt runs in the default no-secret
  env to assert the typed-error contract. expect_error rejects a silent
  empty / fabricated response.
