prompt: |
  Fetch the TLE for NORAD 25544 from Space-Track specifically — use
  source='space-track', not CelesTrak.
tier: single_tool
tools_required: [tle_lookup]
permitted_traces:
  - - tool: tle_lookup
      arg_constraints:
        source: {equals: "space-track"}
      expect_error: "credential_required.spacetrack"
functional_answer: []
notes: |
  Credentialed error-path: with no Space-Track credentials in the
  environment the call must raise the typed credential_required.spacetrack
  (the tool raises before contacting the upstream). This prompt carries no
  requires_credential on purpose — it runs in the default no-secret CI env,
  which is exactly where the typed-error contract is exercised. expect_error
  makes a silent empty success or an upstream.* error fail the trace.
